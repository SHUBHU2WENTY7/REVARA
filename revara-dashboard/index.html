<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="REVARA Central Operations Command Hub — Live telemetry, orders, inventory, circular garment trade-ins, and customer CRM."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>REVARA — Central Operations Command Center</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Zero-flicker Session Pre-Check: Restores active admin class before first paint -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('revara_admin_session');
          if (s) {
            var parsed = JSON.parse(s);
            if (parsed && (parsed.email || parsed.id)) {
              document.documentElement.classList.add('admin-authenticated');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#080C14] text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
