<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REVARA — Central Operations Command Center</title>
  <meta name="description" content="REVARA Central Operations Command Hub — Live telemetry, orders, inventory, circular garment trade-ins, and customer CRM." />
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#EEF2FF',
              100: '#E0E7FF',
              500: '#6366F1',
              600: '#4F46E5',
              700: '#4338CA',
            },
            surface: {
              base: '#080C14',
              card: '#131B2E',
              sidebar: '#0B101D',
              border: '#1E293B'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Supabase JS Client v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Modern Obsidian & Electric Indigo Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#080C14] text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">

  <div class="min-h-screen flex">
    <!-- MASTER SIDEBAR -->
    <aside class="fixed top-0 left-0 bottom-0 z-40 w-72 glass-sidebar flex flex-col justify-between">
      <div>
        <!-- Brand Header -->
        <div class="p-5 border-b border-white/[0.07] flex items-center justify-between bg-gradient-to-b from-[#111728] to-[#0B101D]">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-black flex items-center justify-center shadow-lg shadow-indigo-500/25 border border-white/20 p-1.5">
              <svg viewBox="0 0 24 24" class="w-full h-full" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Image 3 Master Geometric Silhouette -->
                <path d="M4 3L12 8L20 3V21L12 16L4 21V3Z" fill="white"/>
                <!-- Two Square Eyes in Center -->
                <rect x="8.5" y="11" width="2" height="2" fill="black"/>
                <rect x="13.5" y="11" width="2" height="2" fill="black"/>
              </svg>
            </div>
            <div>
              <h1 class="font-extrabold text-base tracking-wider text-white">REVARA</h1>
              <div class="flex items-center gap-1.5 mt-0.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="text-[10px] tracking-widest text-indigo-400 uppercase font-mono font-bold">COMMAND OPS v2.4</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Navigation Links -->
        <div class="overflow-y-auto max-h-[calc(100vh-170px)] px-3 py-4 space-y-5">
          <!-- CORE TELEMETRY -->
          <div>
            <div class="px-3 text-[10px] font-mono tracking-wider text-slate-400 uppercase font-bold">Core Telemetry</div>
            <div class="space-y-1 mt-1.5">
              <button onclick="switchTab('overview')" data-tab="overview" class="nav-tab-btn active-nav-tab w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-white/[0.04] transition-all">
                <span class="flex items-center gap-2.5">
                  <span class="text-base">📊</span> Executive Overview
                </span>
              </button>
              <button onclick="switchTab('activity')" data-tab="activity" class="nav-tab-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-white/[0.04] transition-all">
                <span class="flex items-center gap-2.5">
                  <span class="text-base">⚡</span> Live Operations Feed
                </span>
                <span class="text-[9px] px-1.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 font-mono font-bold">LIVE</span>
              </button>
            </div>
          </div>

          <!-- COMMERCE & FULFILLMENT -->
          <div>
            <div class="px-3 text-[10px] font-mono tracking-wider text-slate-400 uppercase font-bold">Commerce & Fulfillment</div>
            <div class="space-y-1 mt-1.5">
              <button onclick="switchTab('orders')" data-tab="orders" class="nav-tab-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-white/[0.04] transition-all">
                <span class="flex items-center gap-2.5">
                  <span class="text-base">🛍️</span> Order Fulfillment
                </span>
                <span id="badge-orders" class="text-[9px] px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 font-mono font-bold" style="display:none;"></span>
              </button>
              <button onclick="switchTab('products')" data-tab="products" class="nav-tab-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-white/[0.04] transition-all">
                <span class="flex items-center gap-2.5">
                  <span class="text-base">📦</span> Product Catalog
                </span>
              </button>
              <button onclick="switchTab('inventory')" data-tab="inventory" class="nav-tab-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-white/[0.04] transition-all">
                <span class="flex items-center gap-2.5">
                  <span class="text-base">🏢</span> Inventory & Stock Radar
                </span>
                <span id="badge-stock" class="text-[9px] px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-300 font-mono font-bold" style="display:none;"></span>
              </button>
            </div>
          </div>

          <!-- CIRCULAR ECONOMY -->
          <div>
            <div class="px-3 text-[10px] font-mono tracking-wider text-slate-400 uppercase font-bold">Circular Economy</div>
            <div class="space-y-1 mt-1.5">
              <button onclick="switchTab('exchanges')" data-tab="exchanges" class="nav-tab-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-white/[0.04] transition-all">
                <span class="flex items-center gap-2.5">
                  <span class="text-base">♻️</span> Garments Trade-In Studio
                </span>
                <span id="badge-exchanges" class="text-[9px] px-2 py-0.5 rounded-full bg-violet-500/20 text-violet-300 font-mono font-bold" style="display:none;"></span>
              </button>
              <button onclick="switchTab('wallets')" data-tab="wallets" class="nav-tab-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-white/[0.04] transition-all">
                <span class="flex items-center gap-2.5">
                  <span class="text-base">💰</span> Wallets & Credit Ledger
                </span>
              </button>
            </div>
          </div>

          <!-- GROWTH & APP MANAGEMENT -->
          <div>
            <div class="px-3 text-[10px] font-mono tracking-wider text-slate-400 uppercase font-bold">Growth & Collector CRM</div>
            <div class="space-y-1 mt-1.5">
              <button onclick="switchTab('users')" data-tab="users" class="nav-tab-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-white/[0.04] transition-all">
                <span class="flex items-center gap-2.5">
                  <span class="text-base">👥</span> Customer 360 CRM
                </span>
              </button>
              <button onclick="switchTab('reviews')" data-tab="reviews" class="nav-tab-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-white/[0.04] transition-all">
                <span class="flex items-center gap-2.5">
                  <span class="text-base">⭐</span> Reviews & UGC
                </span>
              </button>
              <button onclick="switchTab('coupons')" data-tab="coupons" class="nav-tab-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-white/[0.04] transition-all">
                <span class="flex items-center gap-2.5">
                  <span class="text-base">🏷️</span> Coupons & Promotions
                </span>
              </button>
              <button onclick="switchTab('notifications')" data-tab="notifications" class="nav-tab-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-white/[0.04] transition-all">
                <span class="flex items-center gap-2.5">
                  <span class="text-base">📢</span> In-App Push Alerts
                </span>
              </button>
            </div>
          </div>

          <!-- NETWORK & SYSTEM -->
          <div>
            <div class="px-3 text-[10px] font-mono tracking-wider text-slate-400 uppercase font-bold">Network & Controls</div>
            <div class="space-y-1 mt-1.5">
              <button onclick="switchTab('serviceability')" data-tab="serviceability" class="nav-tab-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-white/[0.04] transition-all">
                <span class="flex items-center gap-2.5">
                  <span class="text-base">📍</span> PIN Codes & Waitlist
                </span>
              </button>
              <button onclick="switchTab('audit_logs')" data-tab="audit_logs" class="nav-tab-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-white/[0.04] transition-all">
                <span class="flex items-center gap-2.5">
                  <span class="text-base">🛡️</span> Forensic Audit Trail
                </span>
              </button>
              <button onclick="switchTab('settings')" data-tab="settings" class="nav-tab-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-white/[0.04] transition-all">
                <span class="flex items-center gap-2.5">
                  <span class="text-base">⚙️</span> Database & Master Seed
                </span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Admin Profile Card Bottom -->
      <div class="p-4 border-t border-white/[0.07] bg-[#0A0E1A]">
        <div class="p-3 rounded-xl bg-slate-900/60 border border-slate-800 flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-indigo-500 to-violet-500 flex items-center justify-center font-bold text-white text-xs shadow-md">
            ST
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-xs font-bold text-white truncate">Shubhanshu Tiwari</p>
            <p class="text-[10px] text-indigo-400 font-mono truncate">Lead Officer · REVARA Admin</p>
          </div>
          <button onclick="handleSyncAll()" title="Force Full Sync" class="text-slate-400 hover:text-indigo-400 transition-colors">
            🔄
          </button>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT VIEW -->
    <div class="flex-1 pl-72 flex flex-col min-w-0">
      <!-- HEADER -->
      <header class="sticky top-0 z-30 h-16 glass-header px-8 flex items-center justify-between">
        <div class="flex items-center gap-4">
          <!-- Realtime Postgres Status Badge -->
          <div class="px-3.5 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/25 text-emerald-400 text-xs font-mono font-semibold flex items-center gap-2 shadow-sm">
            <span class="w-2 h-2 rounded-full bg-emerald-400 status-beacon-active"></span>
            <span>SUPABASE REAL-TIME ACTIVE</span>
          </div>
          <span id="last-sync-badge" class="px-3 py-1 rounded-full bg-slate-800/60 border border-slate-700/60 text-slate-400 text-xs font-mono hidden">
            Sync: <span id="last-sync-time" class="text-slate-200">--</span>
          </span>
        </div>

        <!-- Global Fast Actions -->
        <div class="flex items-center gap-3">
          <button onclick="openBroadcastModal()" class="px-3.5 py-2 rounded-xl btn-secondary text-xs font-semibold flex items-center gap-1.5">
            <span>📢</span>
            <span>Push Alert</span>
          </button>
          <button onclick="openProductModal()" class="px-4 py-2 rounded-xl btn-primary text-xs font-bold font-mono flex items-center gap-1.5">
            <span>+</span>
            <span>Add Product</span>
          </button>
          <button onclick="handleSyncAll()" class="p-2 rounded-xl btn-secondary text-xs" title="Refresh Live Data">
            🔄
          </button>
        </div>
      </header>

      <!-- DYNAMIC CONTENT ROOT -->
      <main id="main-content-view" class="flex-1 p-6 lg:p-8 max-w-7xl w-full mx-auto"></main>
    </div>
  </div>

  <!-- TOASTS CONTAINER -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

  <!-- GLOBAL MODAL CONTAINER -->
  <div id="global-modal-container"></div>

  <!-- Scripts -->
  <script src="js/supabaseClient.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
